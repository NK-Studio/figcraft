[package]
name = "figcraft-spine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft and Spine skeletons: load a Spine 4.3 export (JSON or .skel + .atlas) and pose it into textured triangles (see docs/spine.md)"

[lints]
workspace = true

[features]
default = ["runtime"]
# The Spine runtime (spine2d). Without it skeletons still load as data in the document but never
# pose: every call returns `SpineError::Unavailable`.
runtime = ["dep:spine2d"]

[dependencies]
spine2d = { workspace = true, optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
